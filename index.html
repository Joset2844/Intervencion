<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro de Intervenciones</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --text:#1a1d23; --muted:#6b7280;
  --border:#e3e5e9; --accent:#2563eb; --accent-text:#ffffff;
  --danger:#dc2626; --chip:#eef2ff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161a; --card:#1d2026; --text:#e7e9ee; --muted:#9aa1ac;
    --border:#2b2f37; --accent:#3b82f6; --accent-text:#0b0d10; --danger:#f87171; --chip:#1e2540;
  }
}
*{box-sizing:border-box;}
body{margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
header{position:sticky; top:0; padding:14px 16px; background:var(--card); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; z-index:10;}
header h1{font-size:17px; margin:0;}
.container{max-width:760px; margin:0 auto; padding:14px 14px 40px;}
button{font:inherit; border:none; border-radius:10px; cursor:pointer; padding:10px 14px;}
.btn-primary{background:var(--accent); color:var(--accent-text); font-weight:600;}
.btn-secondary{background:var(--chip); color:var(--text);}
.btn-danger{background:var(--danger); color:#fff;}
.btn-primary:disabled{opacity:.5;}
.card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:12px;}
label{display:block; font-size:12.5px; color:var(--muted); margin:10px 0 4px;}
input, textarea, select{width:100%; padding:9px 10px; border-radius:9px; border:1px solid var(--border);
  background:var(--bg); color:var(--text); font:inherit;}
textarea{min-height:64px; resize:vertical;}
.row2{display:flex; gap:10px;} .row2>div{flex:1; min-width:0;}
.checks{display:flex; gap:14px; flex-wrap:wrap; margin-top:6px;}
.checks label{display:flex; align-items:center; gap:6px; font-size:14px; color:var(--text); margin:0;}
.checks input{width:auto;}
.thumbs{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
.thumbs img{width:64px; height:64px; object-fit:cover; border-radius:8px; border:1px solid var(--border);}
.filters{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px;}
.filters select, .filters input{width:auto; min-width:120px; flex-shrink:0;}
.entry{cursor:pointer;}
.entry-top{display:flex; justify-content:space-between; gap:8px; align-items:baseline;}
.entry-top b{font-size:15px;} .entry-top span{font-size:12px; color:var(--muted); white-space:nowrap;}
.tag{display:inline-block; background:var(--chip); color:var(--accent); font-size:11.5px; padding:2px 8px; border-radius:20px; margin:6px 6px 0 0;}
.entry p{margin:8px 0 0; font-size:13.5px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
.empty{color:var(--muted); text-align:center; padding:30px 10px; font-size:14px;}
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:50; display:none; align-items:flex-end; justify-content:center;}
.overlay.open{display:flex;}
.sheet{background:var(--card); width:100%; max-width:760px; max-height:88vh; overflow-y:auto; border-radius:18px 18px 0 0; padding:18px 16px 30px;}
.sheet h2{margin:0 0 4px; font-size:18px;}
.sheet .meta{color:var(--muted); font-size:13px; margin-bottom:10px;}
.sheet .block{margin-top:12px;} .sheet .block h4{margin:0 0 4px; font-size:12.5px; color:var(--muted); text-transform:uppercase;}
.sheet .photos{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;}
.sheet .photos img{width:90px; height:90px; object-fit:cover; border-radius:10px; border:1px solid var(--border);}
.closebar{display:flex; justify-content:space-between;}
.status{font-size:12.5px; color:var(--muted); margin-top:8px; min-height:16px;} .status.err{color:var(--danger);}
.login-wrap{max-width:360px; margin:15vh auto 0; padding:0 16px;}
.hidden{display:none !important;}
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
  <div class="card">
    <h2 style="margin-top:0;">🛠️ Intervenciones</h2>
    <label>Correo</label><input type="email" id="loginEmail">
    <label>Contraseña</label><input type="password" id="loginPass">
    <div class="status err" id="loginStatus"></div>
    <button class="btn-primary" id="btnLogin" style="width:100%; margin-top:12px;">Entrar</button>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <h1>🛠️ Intervenciones</h1>
    <div style="display:flex; gap:8px;">
      <button class="btn-primary" id="btnNew">+ Nueva</button>
      <button class="btn-secondary" id="btnLogout">Salir</button>
    </div>
  </header>
  <div class="container">
    <div class="filters">
      <select id="fMaquina"><option value="">Todas las máquinas</option></select>
      <input type="text" id="fTecnico" placeholder="Técnico...">
    </div>
    <div id="list"></div>
  </div>
</div>

<div class="overlay" id="formOverlay">
  <div class="sheet">
    <div class="closebar"><span id="formTitle" style="font-weight:600;">Nueva intervención</span>
      <button class="btn-secondary" id="closeForm">Cerrar</button></div>
    <label>Fecha y hora</label><input type="datetime-local" id="fecha">
    <div class="row2">
      <div><label>Turno</label>
        <select id="turno"><option value="">—</option><option>Mañana</option><option>Tarde</option><option>Noche</option></select>
      </div>
      <div><label>Máquina</label><input type="text" id="maquina" list="maquinasList"></div>
    </div>
    <datalist id="maquinasList"></datalist>
    <label>Falla detectada en el producto</label><textarea id="falla"></textarea>
    <label>Descripción de la intervención</label><textarea id="descripcion"></textarea>
    <label>Acciones realizadas</label>
    <div class="checks">
      <label><input type="checkbox" id="acCalibrado">Calibrado</label>
      <label><input type="checkbox" id="acCambiado">Cambiado</label>
      <label><input type="checkbox" id="acRevisado">Revisado</label>
    </div>
    <label>Repuestos utilizados</label><input type="text" id="repuestos">
    <label>Fotos (opcional)</label><input type="file" id="fotos" accept="image/*" multiple>
    <div class="thumbs" id="thumbsPreview"></div>
    <div class="status" id="formStatus"></div>
    <button class="btn-primary" id="btnGuardar" style="width:100%; margin-top:12px;">Guardar</button>
  </div>
</div>

<div class="overlay" id="detailOverlay"><div class="sheet" id="detailSheet"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
import {
  getFirestore, collection, addDoc, updateDoc, deleteDoc, doc,
  query, orderBy, limit, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
import {
  getStorage, ref, uploadBytesResumable, getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-storage.js";

// Comprime una foto en el navegador antes de subirla: reduce el lado más
// largo a maxDim px y la reexporta en JPEG con la calidad indicada.
// Evita depender del tamaño original del móvil (suele ser 3-8 MB).
function compressImage(file, maxDim=1600, quality=0.82){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      URL.revokeObjectURL(url);
      let {width, height} = img;
      if(width > height && width > maxDim){ height = Math.round(height*maxDim/width); width = maxDim; }
      else if(height > maxDim){ width = Math.round(width*maxDim/height); height = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      canvas.toBlob((blob)=>{
        if(!blob) return reject(new Error('No se pudo procesar la imagen'));
        resolve(blob);
      }, 'image/jpeg', quality);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('Imagen no válida')); };
    img.src = url;
  });
}

// Sube un blob con progreso real (0-100) reportado vía onProgress.
function uploadWithProgress(storageRef, blob, onProgress){
  return new Promise((resolve, reject)=>{
    const task = uploadBytesResumable(storageRef, blob, {contentType:'image/jpeg'});
    task.on('state_changed',
      (snap)=> onProgress(Math.round(100*snap.bytesTransferred/snap.totalBytes)),
      reject,
      ()=> resolve()
    );
  });
}

// ⚠️ PEGA AQUÍ tu configuración de Firebase (Configuración del proyecto → General → tus apps → Web)
const firebaseConfig = {
  apiKey: "AIzaSyABjR5kf21oDJKBwXJkgaY5TrYUhv1MHi8",
  authDomain: "intervenciones-maquinas.firebaseapp.com",
  projectId: "intervenciones-maquinas",
  storageBucket: "intervenciones-maquinas.firebasestorage.app",
  messagingSenderId: "432125988213",
  appId: "1:432125988213:web:7c8806ca864710c90bd73c",
  measurementId: "G-KCSYR97F9L"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const dbase = getFirestore(app);
const storage = getStorage(app);

let currentUser = null;
let entries = [];
let editingId = null;

function fmtDate(iso){ const d=new Date(iso); return d.toLocaleString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---- Login ----
document.getElementById('btnLogin').addEventListener('click', async ()=>{
  const email=document.getElementById('loginEmail').value.trim();
  const pass=document.getElementById('loginPass').value;
  const st=document.getElementById('loginStatus');
  st.textContent='';
  try{
    await signInWithEmailAndPassword(auth, email, pass);
  }catch(e){
    st.textContent = 'No se pudo iniciar sesión: revisa correo y contraseña.';
  }
});
document.getElementById('btnLogout').addEventListener('click', ()=> signOut(auth));

onAuthStateChanged(auth, (user)=>{
  currentUser = user;
  document.getElementById('loginScreen').classList.toggle('hidden', !!user);
  document.getElementById('app').classList.toggle('hidden', !user);
  if(user) startListening();
});

// ---- Listado en vivo ----
function startListening(){
  const q = query(collection(dbase,'intervenciones'), orderBy('fecha','desc'), limit(300));
  onSnapshot(q, (snap)=>{
    entries = snap.docs.map(d=>({_id:d.id, ...d.data()}));
    updateMaquinaOptions();
    renderList();
  }, (err)=>console.error(err));
}

function renderList(){
  const fm=document.getElementById('fMaquina').value;
  const ft=document.getElementById('fTecnico').value.trim().toLowerCase();
  const el=document.getElementById('list');
  let items=entries.filter(e=>{
    if(fm && e.maquina!==fm) return false;
    if(ft && !(e.tecnico||'').toLowerCase().includes(ft)) return false;
    return true;
  });
  if(!items.length){ el.innerHTML='<div class="empty">Sin intervenciones registradas todavía.</div>'; return; }
  el.innerHTML=items.map(e=>{
    const acciones=[e.acciones?.calibrado&&'Calibrado',e.acciones?.cambiado&&'Cambiado',e.acciones?.revisado&&'Revisado'].filter(Boolean);
    const thumbs=(e.fotos||[]).slice(0,4).map(u=>`<img src="${u}">`).join('');
    return `<div class="card entry" data-id="${e._id}">
      <div class="entry-top"><b>${esc(e.maquina||'(sin máquina)')}</b><span>${fmtDate(e.fecha)}</span></div>
      <div style="font-size:13px;color:var(--muted);margin-top:2px;">${esc(e.tecnico||'—')}${e.turno?' · '+esc(e.turno):''}</div>
      <p>${esc(e.falla)}</p>
      ${acciones.map(a=>`<span class="tag">${a}</span>`).join('')}
      ${thumbs?`<div class="thumbs">${thumbs}</div>`:''}
    </div>`;
  }).join('');
  el.querySelectorAll('.entry').forEach(node=> node.addEventListener('click',()=>openDetail(node.dataset.id)) );
}

function updateMaquinaOptions(){
  const set=[...new Set(entries.map(e=>e.maquina).filter(Boolean))].sort();
  const sel=document.getElementById('fMaquina'); const cur=sel.value;
  sel.innerHTML='<option value="">Todas las máquinas</option>'+set.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('');
  sel.value=set.includes(cur)?cur:'';
  document.getElementById('maquinasList').innerHTML=set.map(m=>`<option value="${esc(m)}">`).join('');
}

document.getElementById('fMaquina').addEventListener('change',renderList);
document.getElementById('fTecnico').addEventListener('input',renderList);

// ---- Detalle + acciones de admin (el servidor decide si se permiten) ----
function openDetail(id){
  const e=entries.find(x=>x._id===id);
  if(!e) return;
  const acciones=[e.acciones?.calibrado&&'Calibrado',e.acciones?.cambiado&&'Cambiado',e.acciones?.revisado&&'Revisado'].filter(Boolean);
  const photos=(e.fotos||[]).map(u=>`<img src="${u}">`).join('');
  document.getElementById('detailSheet').innerHTML=`
    <div class="closebar">
      <span style="font-weight:600;">${esc(e.maquina||'(sin máquina)')}</span>
      <button class="btn-secondary" id="closeDetail">Cerrar</button>
    </div>
    <div class="meta">${fmtDate(e.fecha)} · ${esc(e.tecnico||'—')}${e.turno?' · '+esc(e.turno):''}</div>
    ${acciones.map(a=>`<span class="tag">${a}</span>`).join('')}
    <div class="block"><h4>Falla en el producto</h4><div>${esc(e.falla)||'—'}</div></div>
    <div class="block"><h4>Descripción de la intervención</h4><div>${esc(e.descripcion)||'—'}</div></div>
    <div class="block"><h4>Repuestos utilizados</h4><div>${esc(e.repuestos)||'—'}</div></div>
    ${photos?`<div class="block"><h4>Fotos</h4><div class="photos">${photos}</div></div>`:''}
    <div class="block" style="display:flex; gap:8px;">
      <button class="btn-secondary" id="btnEdit">Editar (admin)</button>
      <button class="btn-danger" id="btnDelete">Eliminar (admin)</button>
    </div>
    <div class="status err" id="adminStatus"></div>
  `;
  document.getElementById('closeDetail').addEventListener('click',()=>document.getElementById('detailOverlay').classList.remove('open'));
  document.getElementById('btnEdit').addEventListener('click',()=>openForm(e));
  document.getElementById('btnDelete').addEventListener('click',async()=>{
    if(!confirm('¿Eliminar este registro definitivamente?')) return;
    try{
      await deleteDoc(doc(dbase,'intervenciones',e._id));
      document.getElementById('detailOverlay').classList.remove('open');
    }catch(err){
      document.getElementById('adminStatus').textContent='No tienes permisos de administrador para esta acción.';
    }
  });
  document.getElementById('detailOverlay').classList.add('open');
}

// ---- Formulario (nueva / editar) ----
function openForm(existing){
  editingId = existing ? existing._id : null;
  document.getElementById('formTitle').textContent = existing ? 'Editar intervención' : 'Nueva intervención';
  const now=new Date(); now.setMinutes(now.getMinutes()-now.getTimezoneOffset());
  document.getElementById('fecha').value = existing ? new Date(existing.fecha).toISOString().slice(0,16) : now.toISOString().slice(0,16);
  document.getElementById('turno').value = existing?.turno || '';
  document.getElementById('maquina').value = existing?.maquina || '';
  document.getElementById('falla').value = existing?.falla || '';
  document.getElementById('descripcion').value = existing?.descripcion || '';
  document.getElementById('acCalibrado').checked = !!existing?.acciones?.calibrado;
  document.getElementById('acCambiado').checked = !!existing?.acciones?.cambiado;
  document.getElementById('acRevisado').checked = !!existing?.acciones?.revisado;
  document.getElementById('repuestos').value = existing?.repuestos || '';
  document.getElementById('fotos').value='';
  document.getElementById('thumbsPreview').innerHTML='';
  setStatus('');
  document.getElementById('detailOverlay').classList.remove('open');
  document.getElementById('formOverlay').classList.add('open');
}
document.getElementById('btnNew').addEventListener('click',()=>openForm(null));
document.getElementById('closeForm').addEventListener('click',()=>document.getElementById('formOverlay').classList.remove('open'));

document.getElementById('fotos').addEventListener('change',(ev)=>{
  const wrap=document.getElementById('thumbsPreview'); wrap.innerHTML='';
  [...ev.target.files].forEach(f=>{ const img=document.createElement('img'); img.src=URL.createObjectURL(f); wrap.appendChild(img); });
});

function setStatus(msg,isErr){
  const s=document.getElementById('formStatus'); s.textContent=msg||''; s.className='status'+(isErr?' err':'');
}

document.getElementById('btnGuardar').addEventListener('click', async ()=>{
  const maquina=document.getElementById('maquina').value.trim();
  const falla=document.getElementById('falla').value.trim();
  if(!maquina || !falla){ setStatus('Indica al menos la máquina y la falla detectada.',true); return; }
  const btn=document.getElementById('btnGuardar'); btn.disabled=true; setStatus('Guardando...');
  try{
    let photoUrls = editingId ? (entries.find(x=>x._id===editingId)?.fotos || []) : [];
    const files=[...document.getElementById('fotos').files];
    for(let i=0;i<files.length;i++){
      let blob;
      try{
        setStatus(`Comprimiendo foto ${i+1}/${files.length}...`);
        blob = await compressImage(files[i]);
      }catch(e){
        setStatus(`No se pudo procesar la foto ${i+1}, se omite.`,true);
        continue;
      }
      if(blob.size > 10*1024*1024){
        setStatus(`La foto ${i+1} sigue pesando demasiado incluso comprimida; se omite.`,true);
        continue;
      }
      const path = `intervenciones/${currentUser.uid}/${Date.now()}_${i}.jpg`;
      const r = ref(storage, path);
      await uploadWithProgress(r, blob, (pct)=> setStatus(`Subiendo foto ${i+1}/${files.length}... ${pct}%`));
      const url = await getDownloadURL(r);
      photoUrls.push(url);
    }
    const data = {
      fecha:new Date(document.getElementById('fecha').value).toISOString(),
      turno:document.getElementById('turno').value,
      maquina, falla,
      descripcion:document.getElementById('descripcion').value.trim(),
      acciones:{
        calibrado:document.getElementById('acCalibrado').checked,
        cambiado:document.getElementById('acCambiado').checked,
        revisado:document.getElementById('acRevisado').checked,
      },
      repuestos:document.getElementById('repuestos').value.trim(),
      fotos:photoUrls,
      tecnico: currentUser.email,
      autorUid: currentUser.uid,
    };
    if(editingId){
      await updateDoc(doc(dbase,'intervenciones',editingId), data);
    } else {
      data.creadoEn = serverTimestamp();
      await addDoc(collection(dbase,'intervenciones'), data);
    }
    document.getElementById('formOverlay').classList.remove('open');
  }catch(e){
    setStatus(editingId ? 'No tienes permisos de administrador para editar, o hubo un error.' : ('Error al guardar: '+(e?.message||'')),true);
  }finally{
    btn.disabled=false;
  }
});

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
