<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro de Intervenciones</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<style>
:root{
  --bg:#f4f5f8;
  --card:#ffffff;
  --text:#12151a;
  --muted:#6b7280;
  --border:#e5e7ec;
  --accent:#2563eb;
  --accent-hover:#1d4ed8;
  --accent-text:#ffffff;
  --danger:#dc2626;
  --chip:#eef2ff;
  --header-bg:rgba(255,255,255,.80);
  --glow:rgba(37,99,235,.07);
  --ring:0 0 0 3px rgba(37,99,235,.18);
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow-md:0 10px 28px -12px rgba(16,24,40,.22), 0 2px 6px rgba(16,24,40,.05);
  --shadow-lg:0 30px 70px -24px rgba(16,24,40,.45);
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115;
    --card:#181b21;
    --text:#e7e9ee;
    --muted:#98a0ac;
    --border:#272b33;
    --accent:#4f8dff;
    --accent-hover:#6ba1ff;
    --accent-text:#0b0d10;
    --danger:#f87171;
    --chip:#1b2237;
    --header-bg:rgba(24,27,33,.78);
    --glow:rgba(79,141,255,.10);
    --ring:0 0 0 3px rgba(79,141,255,.25);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 12px 30px -14px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.35);
    --shadow-lg:0 30px 70px -24px rgba(0,0,0,.85);
  }
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
body::before{
  content:'';
  position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(720px 440px at 88% -10%, var(--glow), transparent 68%),
    radial-gradient(620px 420px at -12% 8%, var(--glow), transparent 68%);
}

/* ---------- Header ---------- */
header{
  position:sticky; top:0; z-index:10;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;
  background:var(--header-bg);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid transparent;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  transition:border-color .28s ease, box-shadow .28s ease;
}
header.scrolled{
  border-bottom-color:var(--border);
  box-shadow:0 6px 24px -18px rgba(16,24,40,.55);
}
header h1{font-size:17px; margin:0; letter-spacing:-.25px;}
.container{max-width:760px; margin:0 auto; padding:14px 14px calc(40px + env(safe-area-inset-bottom,0px));}

/* ---------- Botones ---------- */
button{
  font:inherit; border:none; border-radius:12px; cursor:pointer; padding:10px 14px;
  position:relative; overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  transition:transform .16s ease, background-color .2s ease, box-shadow .22s ease,
             color .2s ease, opacity .2s ease;
}
button:active{transform:scale(.96);}
button:focus-visible{outline:none; box-shadow:var(--ring);}
.btn-primary{
  background:var(--accent); color:var(--accent-text); font-weight:600;
  box-shadow:0 1px 2px rgba(16,24,40,.08), 0 10px 22px -12px rgba(37,99,235,.75);
}
.btn-primary:hover{background:var(--accent-hover);}
.btn-primary:disabled{opacity:.5; box-shadow:none; cursor:not-allowed; transform:none;}
.btn-secondary{background:var(--chip); color:var(--text);}
.btn-secondary:hover{background:var(--border);}
.btn-danger{background:var(--danger); color:#fff;}
.btn-danger:hover{filter:brightness(1.08);}

.ripple{
  position:absolute; border-radius:50%; pointer-events:none;
  background:currentColor; opacity:.26; transform:scale(0);
  animation:rippleGo .55s ease-out forwards;
}
@keyframes rippleGo{to{transform:scale(1); opacity:0;}}

/* ---------- Tarjetas ---------- */
.card{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px; margin-bottom:12px; box-shadow:var(--shadow-sm);
  transition:transform .22s ease, box-shadow .28s ease, border-color .22s ease;
}

/* ---------- Formularios ---------- */
label{display:block; font-size:12.5px; color:var(--muted); margin:10px 0 4px; letter-spacing:.1px;}
input, textarea, select{
  width:100%; padding:10px 12px; border-radius:12px; border:1px solid var(--border);
  background:var(--bg); color:var(--text); font:inherit; outline:none;
  transition:border-color .18s ease, box-shadow .18s ease, background-color .18s ease;
}
input[type="file"]{padding:8px 10px; font-size:13px;}
input:focus, textarea:focus, select:focus{
  border-color:var(--accent); box-shadow:var(--ring); background:var(--card);
}
textarea{min-height:64px; resize:vertical;}
.row2{display:flex; gap:10px;} .row2>div{flex:1; min-width:0;}
.checks{display:flex; gap:14px; flex-wrap:wrap; margin-top:6px;}
.checks label{display:flex; align-items:center; gap:6px; font-size:14px; color:var(--text); margin:0;}
.checks input{width:auto; accent-color:var(--accent);}
.thumbs{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
.thumbs img{
  width:64px; height:64px; object-fit:cover; border-radius:10px; border:1px solid var(--border);
  animation:popIn .32s ease both;
}

/* ---------- Filtros ---------- */
.filters{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px; scrollbar-width:none;}
.filters::-webkit-scrollbar{display:none;}
.filters select, .filters input{width:auto; min-width:120px; flex-shrink:0;}

/* ---------- Lista de registros ---------- */
.entry{cursor:pointer; animation:riseIn .42s ease both;}
.entry:nth-child(1){animation-delay:0s}
.entry:nth-child(2){animation-delay:.035s}
.entry:nth-child(3){animation-delay:.07s}
.entry:nth-child(4){animation-delay:.105s}
.entry:nth-child(5){animation-delay:.14s}
.entry:nth-child(6){animation-delay:.175s}
.entry:nth-child(7){animation-delay:.21s}
.entry:nth-child(8){animation-delay:.245s}
.entry:nth-child(n+9){animation-delay:.27s}
.entry:active{transform:scale(.985);}
@media (hover:hover){
  .entry:hover{transform:translateY(-2px); box-shadow:var(--shadow-md);}
}
.entry-top{display:flex; justify-content:space-between; gap:8px; align-items:baseline;}
.entry-top b{font-size:15px; letter-spacing:-.15px;}
.entry-top span{font-size:12px; color:var(--muted); white-space:nowrap;}
.tag{
  display:inline-block; background:var(--chip); color:var(--accent); font-size:11.5px;
  padding:3px 9px; border-radius:20px; margin:6px 6px 0 0; font-weight:600;
  animation:popIn .3s ease both;
}
.entry p{margin:8px 0 0; font-size:13.5px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
.empty{color:var(--muted); text-align:center; padding:30px 10px; font-size:14px; animation:riseIn .4s ease both;}

@keyframes riseIn{
  from{opacity:0; transform:translateY(12px) scale(.99);}
  to{opacity:1; transform:none;}
}
@keyframes popIn{
  from{opacity:0; transform:scale(.85);}
  to{opacity:1; transform:none;}
}
@keyframes barGrow{
  from{transform:scaleX(0);}
  to{transform:scaleX(1);}
}

/* ---------- Overlays / Sheets ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(8,10,14,.55); z-index:50;
  display:none; align-items:flex-end; justify-content:center;
  opacity:0;
  transition:opacity .3s ease, display .3s allow-discrete;
}
.overlay.open{display:flex; opacity:1;}
@starting-style{.overlay.open{opacity:0;}}
.sheet{
  background:var(--card); width:100%; max-width:760px; max-height:88vh; overflow-y:auto;
  border-radius:24px 24px 0 0; padding:16px 16px calc(30px + env(safe-area-inset-bottom,0px));
  box-shadow:var(--shadow-lg);
  overscroll-behavior:contain;
  transform:translateY(100%);
  transition:transform .34s cubic-bezier(.22,1,.36,1);
  scrollbar-width:thin;
}
.overlay.open .sheet{transform:none;}
@starting-style{.overlay.open .sheet{transform:translateY(100%);}}
.sheet::before{
  content:''; display:block; width:40px; height:4px; border-radius:99px;
  background:var(--border); margin:0 auto 14px;
}
.sheet h2{margin:0 0 4px; font-size:18px;}
.sheet .meta{color:var(--muted); font-size:13px; margin-bottom:10px;}
.sheet .block{margin-top:14px;}
.sheet .block h4{margin:0 0 4px; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.7px;}
.sheet .photos{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;}
.sheet .photos img{
  width:90px; height:90px; object-fit:cover; border-radius:12px; border:1px solid var(--border);
  cursor:pointer; animation:popIn .34s ease both;
  transition:transform .18s ease, opacity .18s ease, box-shadow .2s ease;
}
.sheet .photos img:active{transform:scale(.95); opacity:.85;}
@media (hover:hover){ .sheet .photos img:hover{transform:scale(1.04); box-shadow:var(--shadow-md);} }

/* ---------- Visor de fotos ---------- */
.photo-viewer{
  position:fixed; inset:0; background:rgba(0,0,0,.94); z-index:200;
  display:none; flex-direction:column; opacity:0;
  transition:opacity .28s ease, display .28s allow-discrete;
}
.photo-viewer.open{display:flex; opacity:1;}
@starting-style{.photo-viewer.open{opacity:0;}}
.pv-track{
  flex:1; display:flex; overflow-x:auto; scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch; scrollbar-width:none; overscroll-behavior:contain;
}
.pv-track::-webkit-scrollbar{display:none;}
.pv-slide{
  flex:0 0 100%; scroll-snap-align:center; scroll-snap-stop:always;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:56px 8px 24px;
}
.pv-slide img{
  max-width:100%; max-height:100%; min-height:0; flex:0 1 auto; object-fit:contain;
  border-radius:8px; animation:pvZoom .38s ease both;
  box-shadow:0 20px 60px -20px rgba(0,0,0,.9);
}
@keyframes pvZoom{
  from{opacity:0; transform:scale(.93);}
  to{opacity:1; transform:none;}
}
.photo-viewer-close{
  position:absolute; top:calc(12px + env(safe-area-inset-top,0px)); right:12px;
  width:42px; height:42px; border:0; border-radius:50%;
  background:rgba(255,255,255,.16); color:#fff; font-size:24px; cursor:pointer; z-index:2;
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  transition:background-color .2s ease, transform .16s ease;
}
.photo-viewer-close:hover{background:rgba(255,255,255,.28);}
.pv-count{
  position:absolute; top:calc(20px + env(safe-area-inset-top,0px)); left:16px;
  color:#fff; font-size:14px; z-index:2; font-variant-numeric:tabular-nums;
  background:rgba(255,255,255,.14); padding:4px 10px; border-radius:20px;
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
}
.pv-nav{
  position:absolute; top:50%; transform:translateY(-50%);
  width:42px; height:42px; border:0; border-radius:50%;
  background:rgba(255,255,255,.16); color:#fff; font-size:22px; z-index:2;
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  transition:background-color .2s ease, transform .16s ease;
}
.pv-nav:hover{background:rgba(255,255,255,.28);}
.pv-prev{left:10px;} .pv-next{right:10px;}
@media (hover:none){ .pv-nav{display:none;} }
.pv-cap{color:#fff; font-size:13px; text-align:center; margin-top:10px; max-height:22vh; overflow:auto; flex:none; padding:0 8px; opacity:.9;}

/* ---------- Autocomplete ---------- */
.ac-wrap{position:relative;}
.ac-list{
  display:none; position:absolute; left:0; top:100%; margin-top:6px;
  min-width:100%; width:max-content; max-width:80vw; max-height:220px; overflow-y:auto;
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  box-shadow:var(--shadow-md); z-index:60;
  opacity:0; transform:translateY(-6px) scale(.98); transform-origin:top left;
  transition:opacity .18s ease, transform .18s ease, display .18s allow-discrete;
}
.ac-list.open{display:block; opacity:1; transform:none;}
@starting-style{.ac-list.open{opacity:0; transform:translateY(-6px) scale(.98);}}
.ac-item,.ac-empty{padding:10px 12px; font-size:14px; border-bottom:1px solid var(--border);}
.ac-item:last-child,.ac-empty:last-child{border-bottom:none;}
.ac-item{transition:background-color .15s ease;}
.ac-item:active{background:var(--chip);}
@media (hover:hover){ .ac-item:hover{background:var(--chip);} }
.ac-empty{color:var(--muted);}

/* ---------- Tabs ---------- */
.tabs{display:flex; gap:4px; padding:8px 14px 0; max-width:760px; margin:0 auto;}
.tab{
  background:transparent; color:var(--muted); border-radius:10px 10px 0 0;
  padding:10px 16px; font-weight:600; position:relative;
  transition:color .22s ease, background-color .22s ease;
}
.tab::after{
  content:''; position:absolute; left:14px; right:14px; bottom:0; height:2.5px;
  border-radius:3px; background:var(--accent);
  transform:scaleX(0); transform-origin:center;
  transition:transform .32s cubic-bezier(.22,1,.36,1);
}
.tab.active{color:var(--accent);}
.tab.active::after{transform:scaleX(1);}
@media (hover:hover){ .tab:hover{color:var(--text);} }

/* ---------- Panel de fotos ---------- */
.ptools{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
.pgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-top:10px;}
.pcard{
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  overflow:hidden; position:relative; box-shadow:var(--shadow-sm);
  animation:riseIn .4s ease both;
  transition:transform .22s ease, box-shadow .26s ease;
}
.pcard:nth-child(1){animation-delay:0s}
.pcard:nth-child(2){animation-delay:.03s}
.pcard:nth-child(3){animation-delay:.06s}
.pcard:nth-child(4){animation-delay:.09s}
.pcard:nth-child(5){animation-delay:.12s}
.pcard:nth-child(6){animation-delay:.15s}
.pcard:nth-child(7){animation-delay:.18s}
.pcard:nth-child(8){animation-delay:.21s}
.pcard:nth-child(n+9){animation-delay:.24s}
@media (hover:hover){ .pcard:hover{transform:translateY(-3px); box-shadow:var(--shadow-md);} }
.pcard img{
  width:100%; aspect-ratio:1; object-fit:cover; display:block; cursor:pointer; background:var(--bg);
  transition:transform .3s ease, opacity .2s ease;
}
@media (hover:hover){ .pcard:hover img{transform:scale(1.04);} }
.pinfo{padding:9px; font-size:12px;} .pinfo b{display:block; font-size:12.5px; letter-spacing:-.1px;}
.pinfo p{margin:4px 0 0; color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.psel{
  position:absolute; top:8px; left:8px; width:22px; height:22px; accent-color:var(--accent);
  cursor:pointer; filter:drop-shadow(0 1px 3px rgba(0,0,0,.5));
}
.pdel{
  position:absolute; top:6px; right:6px; padding:4px 8px; font-size:14px;
  opacity:.9; transition:opacity .2s ease, transform .16s ease;
}
@media (hover:hover){ .pdel{opacity:0;} .pcard:hover .pdel{opacity:1;} }

/* ---------- Chips ---------- */
.chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
.chipbtn{background:var(--chip); color:var(--text); font-weight:600; font-size:13.5px;}
.chipbtn.active{
  background:var(--accent); color:var(--accent-text);
  box-shadow:0 8px 18px -10px rgba(37,99,235,.9);
}

/* ---------- Top ---------- */
.trow{
  display:flex; gap:10px; align-items:center;
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  padding:11px 12px; margin-bottom:8px;
  animation:riseIn .38s ease both;
  transition:transform .2s ease, box-shadow .24s ease;
}
.trow:nth-child(1){animation-delay:0s}
.trow:nth-child(2){animation-delay:.03s}
.trow:nth-child(3){animation-delay:.06s}
.trow:nth-child(4){animation-delay:.09s}
.trow:nth-child(5){animation-delay:.12s}
.trow:nth-child(6){animation-delay:.15s}
.trow:nth-child(n+7){animation-delay:.18s}
@media (hover:hover){ .trow:hover{transform:translateX(3px); box-shadow:var(--shadow-sm);} }
.trank{width:28px; color:var(--muted); font-size:13px; text-align:right; font-variant-numeric:tabular-nums;}
.tmain{flex:1; min-width:0;}
.ttop{display:flex; justify-content:space-between; gap:8px; font-size:14px;}
.ttop b{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600;}
.ttop span{font-variant-numeric:tabular-nums; color:var(--muted);}
.tbar{
  height:6px; border-radius:4px;
  background:linear-gradient(90deg, var(--accent), var(--accent-hover));
  margin-top:7px; min-width:2px; transform-origin:left;
  animation:barGrow .55s ease both;
}

/* ---------- Varios ---------- */
.closebar{display:flex; justify-content:space-between; align-items:center; gap:8px;}
.status{font-size:12.5px; color:var(--muted); margin-top:8px; min-height:16px; transition:color .2s ease;}
.status.err{color:var(--danger);}
.login-wrap{max-width:360px; margin:15vh auto 0; padding:0 16px; animation:riseIn .55s ease both;}
.hidden{display:none !important;}

/* ---------- Accesibilidad de movimiento ---------- */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
}
</style>
</head>

  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);

}
.photo-viewer-close:hover{background:rgba(255,255,255,.28);}
.pv-count{

function pvGo(i){

}

// ---- Lista de máquinas desde Google Sheets (solo 1.ª columna) ----
const MAQUINAS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTVxCxG3XBMgSSedTqw7xWb7s7qxbYB3ZavS8MP9bx2lrwkzlK8oNQRSoFLw_sjjY68b1V0vNUaCb7B/pub?gid=770560989&single=true&output=csv';
let maquinasSheet = [];
try{ maquinasSheet = JSON.parse(localStorage.getItem('maquinasCache')||'[]'); }catch(_){}

function primeraColumnaCSV(text){
  const col=[]; let field='', inQ=false, first=true;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQ=false; }
      else field+=c;
    } else if(c==='"'){ inQ=true; }
    else if(c===','){ if(first){ col.push(field); first=false; } field=''; }
    else if(c==='\n' || c==='\r'){
      if(c==='\r' && text[i+1]==='\n') i++;
      if(first) col.push(field);
      field=''; first=true;
    } else field+=c;
  }
  if(field || !first) { if(first) col.push(field); }
  return col;
}
async function loadMaquinas(){
  try{
    const r = await fetch(MAQUINAS_CSV_URL, { cache:'no-store' });
    if(!r.ok) throw new Error('HTTP '+r.status);
    const lista = primeraColumnaCSV(await r.text()).map(x=>x.trim()).filter(Boolean).slice(1); // quita encabezado
    if(lista.length){
      maquinasSheet = [...new Set(lista)];
      try{ localStorage.setItem('maquinasCache', JSON.stringify(maquinasSheet)); }catch(_){}
    }
    maquinasError = false;
  }catch(err){ maquinasError = !maquinasSheet.length; console.error('No se pudo cargar la lista de máquinas:', err); }
  refreshDatalist();
}
let maquinasError = false;
function opcionesMaquinas(){
  return maquinasSheet.length ? maquinasSheet : [...new Set(entries.map(e=>e.maquina).filter(Boolean))].sort();

  acList.classList.add('open');

// ---- Compresión de imágenes ----
function compressImage(file, maxDim=1600, quality=0.82){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    const timeout = setTimeout(()=>{ URL.revokeObjectURL(url); reject(new Error('timeout')); }, 12000);
    img.onload = ()=>{
      clearTimeout(timeout); URL.revokeObjectURL(url);
      let {width, height} = img;
      if(width > height && width > maxDim){ height = Math.round(height*maxDim/width); width = maxDim; }
      else if(height > maxDim){ width = Math.round(width*maxDim/height); height = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      canvas.toBlob((blob)=>{
        if(!blob) return reject(new Error('No se pudo procesar la imagen'));
        resolve(blob);
      }, 'image/jpeg', quality);
    };
    img.onerror = ()=>{ clearTimeout(timeout); URL.revokeObjectURL(url); reject(new Error('Imagen no válida')); };
    img.src = url;
  });
}

const PAGE = 60;
const urlCache = new Map(); // path -> {url, exp}
const selected = new Set();
let bucketFiles = [];       // {path, size, created}
let pathToEntry = new Map();
let shown = [];
let photoLimit = PAGE;
let renderToken = 0;
let loadingInv = false;

function fmtSize(b){ return b >= 1048576 ? (b/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(b/1024))+' KB'; }
function setPfStatus(msg, err){ const st=document.getElementById('pfStatus'); st.textContent=msg||''; st.className='status'+(err?' err':''); }

async function listFolder(prefix){
  const all = []; let offset = 0;
  while(true){
    const { data, error } = await supabase.storage.from(FOTOS_BUCKET).list(prefix, {
      limit:1000, offset, sortBy:{ column:'name', order:'asc' } });
    if(error) throw error;
    all.push(...data);
    if(data.length < 1000) break;
    offset += 1000;
  }
  return all;
}
async function listBucket(){
  const root = await listFolder('');
  const files = [];
  const add = (path, o)=> files.push({ path, size:o.metadata?.size||0, created:o.created_at||o.updated_at||'' });
  root.filter(o=>o.id!==null && !o.name.startsWith('.')).forEach(o=>add(o.name, o));
  const folders = root.filter(o=>o.id===null).map(o=>o.name);
  const lists = await Promise.all(folders.map(f=>listFolder(f).then(items=>({f, items}))));
  lists.forEach(({f, items})=> items.filter(o=>o.id!==null && !o.name.startsWith('.')).forEach(o=>add(f+'/'+o.name, o)));
  files.sort((a,b)=> (b.created||'').localeCompare(a.created||''));
  return files;
}
async function fetchAllEntries(){
  const all = []; let from = 0;
  while(true){
    const { data, error } = await supabase.from('intervenciones')
      .select('id,fecha,maquina,tecnico,falla,descripcion,repuestos,fotos').order('id').range(from, from+999);
    if(error) throw error;
    all.push(...data);
    if(data.length < 1000) break;
    from += 1000;
  }
  return all;
}

async function loadInventory(){
  if(!isAdmin || loadingInv) return;
  loadingInv = true;
  setPfStatus('Leyendo el bucket...');
  try{
    const [files, ents] = await Promise.all([listBucket(), fetchAllEntries()]);
    bucketFiles = files;
    pathToEntry = new Map();
    ents.forEach(e=> (e.fotos||[]).forEach(p=> pathToEntry.set(p, e)));
    [...selected].forEach(p=>{ if(!files.some(f=>f.path===p)) selected.delete(p); });
    setPfStatus('');
    photoLimit = PAGE;
    updateSummary();
    await renderPhotos();
  }catch(err){
    console.error(err);
    setPfStatus('No se pudo leer el bucket: ' + (err?.message||err) + '. Revisa la política SELECT de administrador en Storage.', true);
  }finally{ loadingInv = false; }
}

function updateSummary(){
  const total = bucketFiles.reduce((a,f)=>a+f.size,0);
  const orf = bucketFiles.filter(f=>!pathToEntry.has(f.path));
  const orfSize = orf.reduce((a,f)=>a+f.size,0);
  document.getElementById('pfSummary').textContent =
    `${bucketFiles.length} fotos en el bucket (${fmtSize(total)}) · huérfanas: ${orf.length} (${fmtSize(orfSize)})`;
}
function updateSel(){
  const b = document.getElementById('pfDelete');
  b.textContent = `Eliminar (${selected.size})`;
  b.disabled = !selected.size;
}
function filteredItems(){
  const q = document.getElementById('pfSearch').value.trim().toLowerCase();
  const f = document.getElementById('pfFilter').value;
  const out = [];
  bucketFiles.forEach(fl=>{
    const e = pathToEntry.get(fl.path) || null;
    if(f==='linked' && !e) return;
    if(f==='orphan' && e) return;
    if(q){
      if(!e) return;
      const hay = [e.falla, e.descripcion, e.maquina, e.tecnico, e.repuestos].join(' ').toLowerCase();
      if(!hay.includes(q)) return;
    }
    out.push({ ...fl, e });
  });
  return out;
}

async function renderPhotos(){
  if(!isAdmin) return;
  const token = ++renderToken;
  const grid = document.getElementById('pgrid');
  const items = filteredItems();
  shown = items.slice(0, photoLimit);
  document.getElementById('pfMore').classList.toggle('hidden', items.length <= shown.length);
  document.getElementById('pfMore').textContent = `Ver más (${items.length - shown.length} restantes)`;
  updateSel();
  if(!shown.length){ grid.innerHTML = '<div class="empty" style="grid-column:1/-1;">No hay fotos que coincidan.</div>'; return; }
  const urls = await signedUrls(shown.map(i=>i.path));
  if(token !== renderToken) return;
  shown.forEach((it,i)=>{ it.url = urls[i]; });
  grid.innerHTML = shown.map((it,i)=>`<div class="pcard">
    <input type="checkbox" class="psel" data-p="${esc(it.path)}" ${selected.has(it.path)?'checked':''}>
    <button class="btn-danger pdel" data-i="${i}">🗑</button>
    ${it.url ? `<img loading="lazy" data-i="${i}" src="${it.url}" alt="">` : '<div class="empty">No disponible</div>'}
    <div class="pinfo">${it.e
      ? `<b>${esc(it.e.maquina||'(sin máquina)')}</b><span>${fmtDate(it.e.fecha)} · ${fmtSize(it.size)}</span><p>${esc(it.e.falla)}</p>`
      : `<b style="color:var(--danger);">Sin registro</b><span>${it.created?fmtDate(it.created):''} · ${fmtSize(it.size)}</span>`}</div>
  </div>`).join('');
}

async function signedUrls(paths){
  const now = Date.now();
  const need = paths.filter(p=>!(urlCache.get(p)?.exp > now));
  if(need.length){
    const { data } = await supabase.storage.from(FOTOS_BUCKET).createSignedUrls(need, 3600);
    (data||[]).forEach(r=>{ if(r.signedUrl) urlCache.set(r.path, { url:r.signedUrl, exp: now + 50*60*1000 }); });
  }
  return paths.map(p=>urlCache.get(p)?.url || null);
}

async function deletePhotos(paths){
  if(!isAdmin || !paths.length) return;
  if(!confirm(`¿Eliminar ${paths.length} foto(s) definitivamente del bucket y de sus registros? No se puede deshacer.`)) return;
  setPfStatus('Eliminando...');
  const names = []; let errMsg = '';
  for(let i=0;i<paths.length;i+=100){
    const { data, error } = await supabase.storage.from(FOTOS_BUCKET).remove(paths.slice(i,i+100));
    if(error){ errMsg = error.message; break; }
    names.push(...(data||[]).map(o=>o.name));
  }
  const removed = new Set(paths.filter(p=> names.some(n=> n===p || p.endsWith('/'+n))));
  if(!removed.size){
    setPfStatus(errMsg ? 'Error al eliminar: '+errMsg : 'No se eliminó nada: falta la política DELETE de administrador en el bucket.', true);
    return;
  }
  const afectados = new Map();
  removed.forEach(p=>{ const e = pathToEntry.get(p); if(e) afectados.set(e.id, e); });
  let fallos = 0;
  for(const e of afectados.values()){
    const { data: rows, error: upErr } = await supabase.from('intervenciones')
      .update({ fotos: (e.fotos||[]).filter(p=>!removed.has(p)) }).eq('id', e.id).select('id');
    if(upErr || !rows?.length) fallos++;
  }
  removed.forEach(p=>{ selected.delete(p); urlCache.delete(p); });
  const noElim = paths.length - removed.size;
  const msg = `Eliminadas ${removed.size} foto(s).` + (noElim ? ` ${noElim} no se pudieron borrar del bucket${errMsg?': '+errMsg:''}.` : '')
    + (fallos ? ` ${fallos} registro(s) no se pudieron actualizar (revisa permisos de UPDATE).` : '');
  fetchEntries();
  await loadInventory();
  setPfStatus(msg, !!(noElim || fallos));
}

let topRows = [];
let topRange = '7';
let loadingTop = false;

async function loadTop(){
  if(!isAdmin || loadingTop) return;
  loadingTop = true;
  const sum = document.getElementById('topSummary');
  sum.className = 'status'; sum.textContent = 'Cargando...';
  try{
    const all = []; let from = 0;
    while(true){
      const { data, error } = await supabase.from('intervenciones').select('maquina,fecha').order('id').range(from, from+999);
      if(error) throw error;
      all.push(...data);
      if(data.length < 1000) break;
      from += 1000;
    }
    topRows = all.map(r=>({ m:(r.maquina||'').trim(), t:new Date(r.fecha).getTime() }));
    renderTop();
  }catch(err){
    console.error(err);
    sum.className = 'status err'; sum.textContent = 'No se pudo cargar: ' + (err?.message||err);
  }finally{ loadingTop = false; }
}

function renderTop(){
  const days = topRange === 'all' ? null : +topRange;
  const since = days ? Date.now() - days*86400000 : 0;
  const order = document.getElementById('topOrder').value;
  const incl = document.getElementById('topZeros').checked;
  const canon = new Map(maquinasSheet.map(m=>[m.toLowerCase(), m]));
  const map = new Map();
  let total = 0;
  topRows.forEach(r=>{
    if(days && !(r.t >= since)) return;
    const name = r.m || '(sin máquina)';
    const key = name.toLowerCase();
    const o = map.get(key) || { name: canon.get(key) || name, count: 0 };
    o.count++; map.set(key, o); total++;
  });
  if(incl) maquinasSheet.forEach(m=>{ const k = m.toLowerCase(); if(!map.has(k)) map.set(k, { name:m, count:0 }); });
  const rows = [...map.values()].sort((a,b)=> (order==='asc' ? a.count-b.count : b.count-a.count) || a.name.localeCompare(b.name));
  const max = Math.max(1, ...rows.map(r=>r.count));
  const label = days ? `últimos ${days} días` : 'histórico completo';
  const sum = document.getElementById('topSummary');
  sum.className = 'status';
  sum.textContent = `${total} intervenciones · ${rows.length} máquinas · ${label}`;
  document.getElementById('topList').innerHTML = rows.length
    ? rows.map((r,i)=>`<div class="trow"><div class="trank">${i+1}</div><div class="tmain">
        <div class="ttop"><b>${esc(r.name)}</b><span>${r.count}</span></div>
        <div class="tbar" style="width:${Math.round(r.count/max*100)}%;${r.count?'':'opacity:.15;'}"></div></div></div>`).join('')
    : '<div class="empty">Sin intervenciones en este rango.</div>';
}

  topRange = b.dataset.r;

  renderTop();
});

document.getElementById('btnGuardar').addEventListener('click', async ()=>{
  const maquina=document.getElementById('maquina').value.trim();
  const falla=document.getElementById('falla').value.trim();
  if(!maquina || !falla){ setStatus('Indica al menos la máquina y la falla detectada.',true); return; }
  const original = editingId ? entries.find(x=>x.id===editingId)?.maquina : null;
  if(maquinasSheet.length && maquina !== original){
    const ok = matchMaquina(maquina);
    if(!ok){ setStatus('Selecciona una máquina de la lista.',true); return; }
    document.getElementById('maquina').value = ok;
  }
  const otraOn = document.getElementById('acOtra').checked;
  const otraTxt = document.getElementById('otraAccion').value.trim();
  if(otraOn && !otraTxt){ setStatus('Describe la otra acción realizada.',true); return; }
  const maquinaFinal = document.getElementById('maquina').value.trim();
  const btn=document.getElementById('btnGuardar'); btn.disabled=true; setStatus('Guardando...');
  try{
    let photoPaths = editingId ? (entries.find(x=>x.id===editingId)?.fotos || []) : [];
    const files=[...document.getElementById('fotos').files];
    for(let i=0;i<files.length;i++){
      let blob = files[i];
      let ext = 'jpg';
      try{
        setStatus(`Comprimiendo foto ${i+1}/${files.length}...`);
        blob = await compressImage(files[i]);
      }catch(e){
        console.error('Compresión falló, se sube el original:', e);
        ext = (files[i].name.split('.').pop()||'jpg').toLowerCase();
      }
      if(blob.size > 10*1024*1024){
        setStatus(`La foto ${i+1} pesa más de 10 MB; se omite.`,true);
        continue;
      }
      const path = `${currentUser.id}/${Date.now()}_${i}.${ext}`;
      setStatus(`Subiendo foto ${i+1}/${files.length}...`);
      const { error: upErr } = await supabase.storage.from(FOTOS_BUCKET).upload(path, blob, {
        contentType: blob.type || 'image/jpeg', upsert:false
      });
      if(upErr){
        console.error('Fallo al subir foto:', upErr);
        setStatus(`No se pudo subir la foto ${i+1}: ${upErr.message}. Se omite.`,true);
        continue;
      }
      photoPaths.push(path);
    }
    const data = {
      fecha:new Date(document.getElementById('fecha').value).toISOString(),
      turno:document.getElementById('turno').value,
      maquina: maquinaFinal, falla,
      descripcion:document.getElementById('descripcion').value.trim(),
      calibrado:document.getElementById('acCalibrado').checked,
      cambiado:document.getElementById('acCambiado').checked,
      revisado:document.getElementById('acRevisado').checked,
      otra_accion: otraOn ? otraTxt : '',
      repuestos:document.getElementById('repuestos').value.trim(),
      fotos:photoPaths,
      tecnico: soloUsuario(currentUser.email),
      autor_uid: currentUser.id,
    };
    let error;
    if(editingId){
      ({ error } = await supabase.from('intervenciones').update(data).eq('id', editingId));
    } else {
      ({ error } = await supabase.from('intervenciones').insert(data));
    }
    if(error){
      setStatus(editingId ? 'No tienes permisos de administrador para editar, o hubo un error.' : ('Error al guardar: '+error.message), true);
      return;
    }
    document.getElementById('formOverlay').classList.remove('open');
  }catch(e){
    setStatus('Error inesperado: '+(e?.message||e), true);
  }finally{
    btn.disabled=false;
  }
});

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
