<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro de Intervenciones</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --text:#1a1d23; --muted:#6b7280;
  --border:#e3e5e9; --accent:#2563eb; --accent-text:#ffffff;
  --danger:#dc2626; --chip:#eef2ff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161a; --card:#1d2026; --text:#e7e9ee; --muted:#9aa1ac;
    --border:#2b2f37; --accent:#3b82f6; --accent-text:#0b0d10; --danger:#f87171; --chip:#1e2540;
  }
}
*{box-sizing:border-box;}
body{margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
header{position:sticky; top:0; padding:14px 16px; background:var(--card); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; z-index:10;}
header h1{font-size:17px; margin:0;}
.container{max-width:760px; margin:0 auto; padding:14px 14px 40px;}
button{font:inherit; border:none; border-radius:10px; cursor:pointer; padding:10px 14px;}
.btn-primary{background:var(--accent); color:var(--accent-text); font-weight:600;}
.btn-secondary{background:var(--chip); color:var(--text);}
.btn-danger{background:var(--danger); color:#fff;}
.btn-primary:disabled{opacity:.5;}
.card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:12px;}
label{display:block; font-size:12.5px; color:var(--muted); margin:10px 0 4px;}
input, textarea, select{width:100%; padding:9px 10px; border-radius:9px; border:1px solid var(--border);
  background:var(--bg); color:var(--text); font:inherit;}
textarea{min-height:64px; resize:vertical;}
.row2{display:flex; gap:10px;} .row2>div{flex:1; min-width:0;}
.checks{display:flex; gap:14px; flex-wrap:wrap; margin-top:6px;}
.checks label{display:flex; align-items:center; gap:6px; font-size:14px; color:var(--text); margin:0;}
.checks input{width:auto;}
.thumbs{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
.thumbs img{width:64px; height:64px; object-fit:cover; border-radius:8px; border:1px solid var(--border);}
.filters{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px;}
.filters select, .filters input{width:auto; min-width:120px; flex-shrink:0;}
.entry{cursor:pointer;}
.entry-top{display:flex; justify-content:space-between; gap:8px; align-items:baseline;}
.entry-top b{font-size:15px;} .entry-top span{font-size:12px; color:var(--muted); white-space:nowrap;}
.tag{display:inline-block; background:var(--chip); color:var(--accent); font-size:11.5px; padding:2px 8px; border-radius:20px; margin:6px 6px 0 0;}
.entry p{margin:8px 0 0; font-size:13.5px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
.empty{color:var(--muted); text-align:center; padding:30px 10px; font-size:14px;}
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:50; display:none; align-items:flex-end; justify-content:center;}
.overlay.open{display:flex;}
.sheet{background:var(--card); width:100%; max-width:760px; max-height:88vh; overflow-y:auto; border-radius:18px 18px 0 0; padding:18px 16px 30px;}
.sheet h2{margin:0 0 4px; font-size:18px;}
.sheet .meta{color:var(--muted); font-size:13px; margin-bottom:10px;}
.sheet .block{margin-top:12px;} .sheet .block h4{margin:0 0 4px; font-size:12.5px; color:var(--muted); text-transform:uppercase;}
.sheet .photos{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:6px;
}

.sheet .photos img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid var(--border);
  cursor:pointer;
  transition:transform .15s ease, opacity .15s ease;
}

.sheet .photos img:active{
  transform:scale(.96);
  opacity:.8;
}

/* Visor de fotos (galería deslizante) */
.photo-viewer{position:fixed; inset:0; background:rgba(0,0,0,.94); z-index:200; display:none; flex-direction:column;}
.photo-viewer.open{display:flex;}
.pv-track{flex:1; display:flex; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
.pv-track::-webkit-scrollbar{display:none;}
.pv-slide{flex:0 0 100%; scroll-snap-align:center; scroll-snap-stop:always; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:56px 8px 24px;}
.pv-slide img{max-width:100%; max-height:100%; min-height:0; flex:0 1 auto; object-fit:contain; border-radius:6px;}
.photo-viewer-close{position:absolute; top:calc(12px + env(safe-area-inset-top,0px)); right:12px; width:42px; height:42px; border:0; border-radius:50%;
  background:rgba(255,255,255,.18); color:#fff; font-size:24px; cursor:pointer; z-index:2;}
.pv-count{position:absolute; top:calc(20px + env(safe-area-inset-top,0px)); left:16px; color:#fff; font-size:14px; z-index:2;}
.pv-nav{position:absolute; top:50%; transform:translateY(-50%); width:42px; height:42px; border:0; border-radius:50%;
  background:rgba(255,255,255,.18); color:#fff; font-size:22px; z-index:2;}
.pv-prev{left:10px;} .pv-next{right:10px;}
@media (hover:none){ .pv-nav{display:none;} }
.ac-wrap{position:relative;}
.ac-list{display:none; position:absolute; left:0; top:100%; margin-top:4px; min-width:100%; width:max-content; max-width:80vw; max-height:220px; overflow-y:auto;
  background:var(--card); border:1px solid var(--border); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:60;}
.ac-list.open{display:block;}
.ac-item,.ac-empty{padding:10px 12px; font-size:14px; border-bottom:1px solid var(--border);}
.ac-item:active{background:var(--chip);} .ac-empty{color:var(--muted);}
.tabs{display:flex; gap:6px; padding:8px 14px 0; max-width:760px; margin:0 auto;}
.tab{background:transparent; color:var(--muted); border-radius:10px 10px 0 0; padding:9px 16px; font-weight:600; border-bottom:2px solid transparent;}
.tab.active{color:var(--accent); border-bottom-color:var(--accent);}
.ptools{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
.pgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-top:10px;}
.pcard{background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; position:relative;}
.pcard img{width:100%; aspect-ratio:1; object-fit:cover; display:block; cursor:pointer; background:var(--bg);}
.pinfo{padding:8px; font-size:12px;} .pinfo b{display:block; font-size:12.5px;}
.pinfo p{margin:4px 0 0; color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.psel{position:absolute; top:8px; left:8px; width:22px; height:22px; accent-color:var(--accent);}
.pdel{position:absolute; top:6px; right:6px; padding:4px 8px; font-size:14px;}
.pv-cap{color:#fff; font-size:13px; text-align:center; margin-top:8px; max-height:22vh; overflow:auto; flex:none; padding:0 8px;}
.closebar{display:flex; justify-content:space-between;}
.status{font-size:12.5px; color:var(--muted); margin-top:8px; min-height:16px;} .status.err{color:var(--danger);}
.login-wrap{max-width:360px; margin:15vh auto 0; padding:0 16px;}
.hidden{display:none !important;}
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
  <div class="card">
    <h2 style="margin-top:0;">🛠️ Intervenciones</h2>
    <label>Usuario</label><input type="text" id="loginEmail" autocomplete="username" placeholder="ej: jperez">
    <label>Contraseña</label><input type="password" id="loginPass">
    <div class="status err" id="loginStatus"></div>
    <button class="btn-primary" id="btnLogin" style="width:100%; margin-top:12px;">Entrar</button>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <h1>🛠️ Intervenciones</h1>

<div class="overlay" id="formOverlay">

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// ⚠️ PEGA AQUÍ tu URL y anon key de Supabase (Project Settings → API)
const SUPABASE_URL = 'https://skoksthbuyrhekfchmug.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_fSLsBpAkdOTtzxaTwRUmWw_uDEGE5-3';
// Todas las tablas viven en el esquema "intervenciones" (no "public"),
// para no chocar con las tablas de tu otra app en el mismo proyecto.
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  db: { schema: 'intervenciones' }
});

const FOTOS_BUCKET = 'intervenciones-fotos';
// Los técnicos inician sesión solo con su usuario (sin @...): se completa
// aquí con este dominio ficticio, igual que en el otro proyecto.
const USER_DOMAIN = 'planta.local';
function aCorreo(usuario){ return `${usuario.trim().toLowerCase()}@${USER_DOMAIN}`; }
function soloUsuario(correo){ return (correo||'').split('@')[0]; }

let currentUser = null;
let entries = [];
let editingId = null;
const ADMIN_USERS = ['admin']; // usuarios que ven la pestaña Fotos
let isAdmin = false;

// ---- Visor de fotos: galería deslizante ----
const photoViewer = document.getElementById('photoViewer');
const pvTrack = document.getElementById('pvTrack');
const pvCount = document.getElementById('pvCount');

function pvIndex(){ return Math.round(pvTrack.scrollLeft / (pvTrack.clientWidth || 1)); }
function pvUpdate(){ pvCount.textContent = `${pvIndex()+1} / ${pvTrack.children.length}`; }
function pvGo(i){
  const n = pvTrack.children.length;
  i = Math.max(0, Math.min(n-1, i));
  pvTrack.scrollTo({ left: i * pvTrack.clientWidth, behavior:'smooth' });
}
function openPhotoViewer(urls, start=0, captions=[]){
  pvTrack.innerHTML = urls.map((u,i)=>`<div class="pv-slide"><img src="${u}" alt="Foto ${i+1}">${captions[i]?`<div class="pv-cap">${captions[i]}</div>`:''}</div>`).join('');
  photoViewer.classList.add('open');
  pvTrack.style.scrollBehavior = 'auto';
  pvTrack.scrollLeft = start * pvTrack.clientWidth;
  pvTrack.style.scrollBehavior = '';
  pvUpdate();
  const multi = urls.length > 1;
  pvCount.style.display = multi ? '' : 'none';
  document.getElementById('pvPrev').style.visibility = multi ? '' : 'hidden';
  document.getElementById('pvNext').style.visibility = multi ? '' : 'hidden';
}
function closePhotoViewerFn(){
  photoViewer.classList.remove('open');
  pvTrack.innerHTML = '';
}
pvTrack.addEventListener('scroll', pvUpdate, { passive:true });
document.getElementById('closePhotoViewer').addEventListener('click', closePhotoViewerFn);
document.getElementById('pvPrev').addEventListener('click', ()=> pvGo(pvIndex()-1));
document.getElementById('pvNext').addEventListener('click', ()=> pvGo(pvIndex()+1));
pvTrack.addEventListener('click', (e)=>{ if(e.target.tagName !== 'IMG') closePhotoViewerFn(); });
document.addEventListener('keydown', (e)=>{
  if(!photoViewer.classList.contains('open')) return;
  if(e.key==='Escape') closePhotoViewerFn();
  if(e.key==='ArrowLeft') pvGo(pvIndex()-1);
  if(e.key==='ArrowRight') pvGo(pvIndex()+1);
});

// ---- Lista de máquinas desde Google Sheets (solo 1.ª columna) ----
const MAQUINAS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTVxCxG3XBMgSSedTqw7xWb7s7qxbYB3ZavS8MP9bx2lrwkzlK8oNQRSoFLw_sjjY68b1V0vNUaCb7B/pub?gid=770560989&single=true&output=csv';
let maquinasSheet = [];
try{ maquinasSheet = JSON.parse(localStorage.getItem('maquinasCache')||'[]'); }catch(_){}

function primeraColumnaCSV(text){
  const col=[]; let field='', inQ=false, first=true;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQ=false; }
      else field+=c;
    } else if(c==='"'){ inQ=true; }
    else if(c===','){ if(first){ col.push(field); first=false; } field=''; }
    else if(c==='\n' || c==='\r'){
      if(c==='\r' && text[i+1]==='\n') i++;
      if(first) col.push(field);
      field=''; first=true;
    } else field+=c;
  }
  if(field || !first) { if(first) col.push(field); }
  return col;
}
async function loadMaquinas(){
  try{
    const r = await fetch(MAQUINAS_CSV_URL, { cache:'no-store' });
    if(!r.ok) throw new Error('HTTP '+r.status);
    const lista = primeraColumnaCSV(await r.text()).map(x=>x.trim()).filter(Boolean).slice(1); // quita encabezado
    if(lista.length){
      maquinasSheet = [...new Set(lista)];
      try{ localStorage.setItem('maquinasCache', JSON.stringify(maquinasSheet)); }catch(_){}
    }
    maquinasError = false;
  }catch(err){ maquinasError = !maquinasSheet.length; console.error('No se pudo cargar la lista de máquinas:', err); }
  refreshDatalist();
}
let maquinasError = false;
function opcionesMaquinas(){
  return maquinasSheet.length ? maquinasSheet : [...new Set(entries.map(e=>e.maquina).filter(Boolean))].sort();
}
const inpM = document.getElementById('maquina');
const acList = document.getElementById('acList');
function renderAc(){
  const q = inpM.value.trim().toLowerCase();
  const items = opcionesMaquinas().filter(m=>!q || m.toLowerCase().includes(q)).slice(0,150);
  acList.innerHTML = items.length
    ? items.map(m=>`<div class="ac-item" data-v="${esc(m)}">${esc(m)}</div>`).join('')
    : `<div class="ac-empty">${maquinasSheet.length ? 'Sin coincidencias' : (maquinasError ? 'No se pudo cargar la lista' : 'Cargando lista...')}</div>`;
  acList.classList.add('open');
}
function refreshDatalist(){ if(acList.classList.contains('open')) renderAc(); }
inpM.addEventListener('focus', renderAc);
inpM.addEventListener('click', renderAc);
inpM.addEventListener('input', renderAc);
inpM.addEventListener('blur', ()=> acList.classList.remove('open'));
acList.addEventListener('mousedown', (e)=> e.preventDefault());
acList.addEventListener('click', (e)=>{
  const it = e.target.closest('.ac-item'); if(!it) return;
  inpM.value = it.dataset.v; acList.classList.remove('open'); inpM.blur();
});
function matchMaquina(v){
  const t=v.trim().toLowerCase();
  return maquinasSheet.find(m=>m.toLowerCase()===t) || null;
}

function accionesDe(e){
  return [e.calibrado&&'Calibración', e.cambiado&&'Cambio', e.revisado&&'Revisión', e.otra_accion&&('Otra: '+esc(e.otra_accion))].filter(Boolean);
}
function fmtDate(iso){ const d=new Date(iso); return d.toLocaleString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---- Compresión de imágenes ----
function compressImage(file, maxDim=1600, quality=0.82){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    const timeout = setTimeout(()=>{ URL.revokeObjectURL(url); reject(new Error('timeout')); }, 12000);
    img.onload = ()=>{
      clearTimeout(timeout); URL.revokeObjectURL(url);
      let {width, height} = img;
      if(width > height && width > maxDim){ height = Math.round(height*maxDim/width); width = maxDim; }
      else if(height > maxDim){ width = Math.round(width*maxDim/height); height = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      canvas.toBlob((blob)=>{
        if(!blob) return reject(new Error('No se pudo procesar la imagen'));
        resolve(blob);
      }, 'image/jpeg', quality);
    };
    img.onerror = ()=>{ clearTimeout(timeout); URL.revokeObjectURL(url); reject(new Error('Imagen no válida')); };
    img.src = url;
  });
}

// ---- Login ----
document.getElementById('btnLogin').addEventListener('click', async ()=>{
  const usuario=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPass').value;
  const st=document.getElementById('loginStatus'); st.textContent='';
  if(!usuario){ st.textContent='Escribe tu usuario.'; return; }
  const { error } = await supabase.auth.signInWithPassword({ email: aCorreo(usuario), password });
  if(error) st.textContent = 'No se pudo iniciar sesión: revisa usuario y contraseña.';
});
document.getElementById('btnLogout').addEventListener('click', ()=> supabase.auth.signOut());

supabase.auth.onAuthStateChange((_event, session)=>{
  const prevId = currentUser?.id;
  currentUser = session?.user || null;
  isAdmin = !!currentUser && ADMIN_USERS.includes(soloUsuario(currentUser.email));
  document.getElementById('tabs').classList.toggle('hidden', !isAdmin);
  document.getElementById('loginScreen').classList.toggle('hidden', !!currentUser);
  document.getElementById('app').classList.toggle('hidden', !currentUser);
  if(currentUser){ loadMaquinas(); startListening(); }
  if(isAdmin && currentUser.id !== prevId) switchTab('fotos');
  if(!isAdmin) switchTab('registros');
});

// ---- Listado en vivo ----
let realtimeChannel = null;
async function fetchEntries(){
  const { data, error } = await supabase.from('intervenciones')
    .select('*').order('fecha', { ascending:false }).limit(300);
  if(error){ console.error(error); return; }
  entries = data;
  updateMaquinaOptions();
  renderList();
}
function startListening(){
  fetchEntries();
  if(realtimeChannel) return;
  realtimeChannel = supabase.channel('intervenciones-live')
    .on('postgres_changes', { event:'*', schema:'intervenciones', table:'intervenciones' }, ()=> fetchEntries())
    .subscribe();
}

function renderList(){
  const fm=document.getElementById('fMaquina').value;
  const ft=document.getElementById('fTecnico').value.trim().toLowerCase();
  const el=document.getElementById('list');
  let items=entries.filter(e=>{
    if(fm && e.maquina!==fm) return false;
    if(ft && !(e.tecnico||'').toLowerCase().includes(ft)) return false;
    return true;
  });
  if(!items.length){ el.innerHTML='<div class="empty">Sin intervenciones registradas todavía.</div>'; return; }
  el.innerHTML=items.map(e=>{
    const acciones=accionesDe(e);
    const nfotos = (e.fotos||[]).length;
    return `<div class="card entry" data-id="${e.id}">
      <div class="entry-top"><b>${esc(e.maquina||'(sin máquina)')}</b><span>${fmtDate(e.fecha)}</span></div>
      <div style="font-size:13px;color:var(--muted);margin-top:2px;">${esc(e.tecnico||'—')}${e.turno?' · '+esc(e.turno):''}</div>
      <p>${esc(e.falla)}</p>
      ${acciones.map(a=>`<span class="tag">${a}</span>`).join('')}
      ${nfotos?`<span class="tag">📷 ${nfotos} foto${nfotos>1?'s':''}</span>`:''}
    </div>`;
  }).join('');
  el.querySelectorAll('.entry').forEach(node=> node.addEventListener('click',()=>openDetail(node.dataset.id)) );
}

function updateMaquinaOptions(){
  const set=[...new Set(entries.map(e=>e.maquina).filter(Boolean))].sort();
  const sel=document.getElementById('fMaquina'); const cur=sel.value;
  sel.innerHTML='<option value="">Todas las máquinas</option>'+set.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('');
  sel.value=set.includes(cur)?cur:'';
  refreshDatalist();
}

document.getElementById('fMaquina').addEventListener('change',renderList);
document.getElementById('fTecnico').addEventListener('input',renderList);

// ---- Panel admin: fotos (todo el contenido del bucket) ----
const PAGE = 60;
const urlCache = new Map(); // path -> {url, exp}
const selected = new Set();
let bucketFiles = [];       // {path, size, created}
let pathToEntry = new Map();
let shown = [];
let photoLimit = PAGE;
let renderToken = 0;
let loadingInv = false;

function fmtSize(b){ return b >= 1048576 ? (b/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(b/1024))+' KB'; }
function setPfStatus(msg, err){ const st=document.getElementById('pfStatus'); st.textContent=msg||''; st.className='status'+(err?' err':''); }

function switchTab(t){
  document.getElementById('viewRegistros').classList.toggle('hidden', t!=='registros');
  document.getElementById('viewFotos').classList.toggle('hidden', t!=='fotos');
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===t));
  if(t==='fotos') loadInventory();
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));

async function listFolder(prefix){
  const all = []; let offset = 0;
  while(true){
    const { data, error } = await supabase.storage.from(FOTOS_BUCKET).list(prefix, {
      limit:1000, offset, sortBy:{ column:'name', order:'asc' } });
    if(error) throw error;
    all.push(...data);
    if(data.length < 1000) break;
    offset += 1000;
  }
  return all;
}
async function listBucket(){
  const root = await listFolder('');
  const files = [];
  const add = (path, o)=> files.push({ path, size:o.metadata?.size||0, created:o.created_at||o.updated_at||'' });
  root.filter(o=>o.id!==null && !o.name.startsWith('.')).forEach(o=>add(o.name, o));
  const folders = root.filter(o=>o.id===null).map(o=>o.name);
  const lists = await Promise.all(folders.map(f=>listFolder(f).then(items=>({f, items}))));
  lists.forEach(({f, items})=> items.filter(o=>o.id!==null && !o.name.startsWith('.')).forEach(o=>add(f+'/'+o.name, o)));
  files.sort((a,b)=> (b.created||'').localeCompare(a.created||''));
  return files;
}
async function fetchAllEntries(){
  const all = []; let from = 0;
  while(true){
    const { data, error } = await supabase.from('intervenciones')
      .select('id,fecha,maquina,tecnico,falla,descripcion,repuestos,fotos').order('id').range(from, from+999);
    if(error) throw error;
    all.push(...data);
    if(data.length < 1000) break;
    from += 1000;
  }
  return all;
}

async function loadInventory(){
  if(!isAdmin || loadingInv) return;
  loadingInv = true;
  setPfStatus('Leyendo el bucket...');
  try{
    const [files, ents] = await Promise.all([listBucket(), fetchAllEntries()]);
    bucketFiles = files;
    pathToEntry = new Map();
    ents.forEach(e=> (e.fotos||[]).forEach(p=> pathToEntry.set(p, e)));
    [...selected].forEach(p=>{ if(!files.some(f=>f.path===p)) selected.delete(p); });
    setPfStatus('');
    photoLimit = PAGE;
    updateSummary();
    await renderPhotos();
  }catch(err){
    console.error(err);
    setPfStatus('No se pudo leer el bucket: ' + (err?.message||err) + '. Revisa la política SELECT de administrador en Storage.', true);
  }finally{ loadingInv = false; }
}

function updateSummary(){
  const total = bucketFiles.reduce((a,f)=>a+f.size,0);
  const orf = bucketFiles.filter(f=>!pathToEntry.has(f.path));
  const orfSize = orf.reduce((a,f)=>a+f.size,0);
  document.getElementById('pfSummary').textContent =
    `${bucketFiles.length} fotos en el bucket (${fmtSize(total)}) · huérfanas: ${orf.length} (${fmtSize(orfSize)})`;
}
function updateSel(){
  const b = document.getElementById('pfDelete');
  b.textContent = `Eliminar (${selected.size})`;
  b.disabled = !selected.size;
}
function filteredItems(){
  const q = document.getElementById('pfSearch').value.trim().toLowerCase();
  const f = document.getElementById('pfFilter').value;
  const out = [];
  bucketFiles.forEach(fl=>{
    const e = pathToEntry.get(fl.path) || null;
    if(f==='linked' && !e) return;
    if(f==='orphan' && e) return;
    if(q){
      if(!e) return;
      const hay = [e.falla, e.descripcion, e.maquina, e.tecnico, e.repuestos].join(' ').toLowerCase();
      if(!hay.includes(q)) return;
    }
    out.push({ ...fl, e });
  });
  return out;
}

async function renderPhotos(){
  if(!isAdmin) return;
  const token = ++renderToken;
  const grid = document.getElementById('pgrid');
  const items = filteredItems();
  shown = items.slice(0, photoLimit);
  document.getElementById('pfMore').classList.toggle('hidden', items.length <= shown.length);
  document.getElementById('pfMore').textContent = `Ver más (${items.length - shown.length} restantes)`;
  updateSel();
  if(!shown.length){ grid.innerHTML = '<div class="empty" style="grid-column:1/-1;">No hay fotos que coincidan.</div>'; return; }
  const urls = await signedUrls(shown.map(i=>i.path));
  if(token !== renderToken) return;
  shown.forEach((it,i)=>{ it.url = urls[i]; });
  grid.innerHTML = shown.map((it,i)=>`<div class="pcard">
    <input type="checkbox" class="psel" data-p="${esc(it.path)}" ${selected.has(it.path)?'checked':''}>
    <button class="btn-danger pdel" data-i="${i}">🗑</button>
    ${it.url ? `<img loading="lazy" data-i="${i}" src="${it.url}" alt="">` : '<div class="empty">No disponible</div>'}
    <div class="pinfo">${it.e
      ? `<b>${esc(it.e.maquina||'(sin máquina)')}</b><span>${fmtDate(it.e.fecha)} · ${fmtSize(it.size)}</span><p>${esc(it.e.falla)}</p>`
      : `<b style="color:var(--danger);">Sin registro</b><span>${it.created?fmtDate(it.created):''} · ${fmtSize(it.size)}</span>`}</div>
  </div>`).join('');
}

async function signedUrls(paths){
  const now = Date.now();
  const need = paths.filter(p=>!(urlCache.get(p)?.exp > now));
  if(need.length){
    const { data } = await supabase.storage.from(FOTOS_BUCKET).createSignedUrls(need, 3600);
    (data||[]).forEach(r=>{ if(r.signedUrl) urlCache.set(r.path, { url:r.signedUrl, exp: now + 50*60*1000 }); });
  }
  return paths.map(p=>urlCache.get(p)?.url || null);
}

document.getElementById('pgrid').addEventListener('click', (ev)=>{
  const del = ev.target.closest('.pdel');
  if(del){ deletePhotos([shown[+del.dataset.i].path]); return; }
  const img = ev.target.closest('img[data-i]');
  if(img){
    const vis = shown.filter(x=>x.url);
    const idx = vis.indexOf(shown[+img.dataset.i]);
    openPhotoViewer(vis.map(x=>x.url), Math.max(0,idx),
      vis.map(x=> x.e ? `<b>${esc(x.e.maquina||'')}</b> · ${fmtDate(x.e.fecha)}<br>${esc(x.e.falla)}` : 'Sin registro asociado'));
  }
});
document.getElementById('pgrid').addEventListener('change', (ev)=>{
  const c = ev.target.closest('.psel'); if(!c) return;
  if(c.checked) selected.add(c.dataset.p); else selected.delete(c.dataset.p);
  updateSel();
});
let pfTimer = null;
document.getElementById('pfSearch').addEventListener('input', ()=>{ clearTimeout(pfTimer); pfTimer = setTimeout(()=>{ photoLimit=PAGE; renderPhotos(); }, 300); });
document.getElementById('pfFilter').addEventListener('change', ()=>{ photoLimit=PAGE; renderPhotos(); });
document.getElementById('pfRefresh').addEventListener('click', loadInventory);
document.getElementById('pfMore').addEventListener('click', ()=>{ photoLimit += PAGE; renderPhotos(); });
document.getElementById('pfSelAll').addEventListener('click', ()=>{
  const paths = filteredItems().map(i=>i.path);
  const all = paths.length && paths.every(p=>selected.has(p));
  paths.forEach(p=> all ? selected.delete(p) : selected.add(p));
  document.querySelectorAll('#pgrid .psel').forEach(c=>{ c.checked = selected.has(c.dataset.p); });
  updateSel();
});
document.getElementById('pfDelete').addEventListener('click', ()=> deletePhotos([...selected]));

async function deletePhotos(paths){
  if(!isAdmin || !paths.length) return;
  if(!confirm(`¿Eliminar ${paths.length} foto(s) definitivamente del bucket y de sus registros? No se puede deshacer.`)) return;
  setPfStatus('Eliminando...');
  const names = []; let errMsg = '';
  for(let i=0;i<paths.length;i+=100){
    const { data, error } = await supabase.storage.from(FOTOS_BUCKET).remove(paths.slice(i,i+100));
    if(error){ errMsg = error.message; break; }
    names.push(...(data||[]).map(o=>o.name));
  }
  const removed = new Set(paths.filter(p=> names.some(n=> n===p || p.endsWith('/'+n))));
  if(!removed.size){
    setPfStatus(errMsg ? 'Error al eliminar: '+errMsg : 'No se eliminó nada: falta la política DELETE de administrador en el bucket.', true);
    return;
  }
  const afectados = new Map();
  removed.forEach(p=>{ const e = pathToEntry.get(p); if(e) afectados.set(e.id, e); });
  let fallos = 0;
  for(const e of afectados.values()){
    const { data: rows, error: upErr } = await supabase.from('intervenciones')
      .update({ fotos: (e.fotos||[]).filter(p=>!removed.has(p)) }).eq('id', e.id).select('id');
    if(upErr || !rows?.length) fallos++;
  }
  removed.forEach(p=>{ selected.delete(p); urlCache.delete(p); });
  const noElim = paths.length - removed.size;
  const msg = `Eliminadas ${removed.size} foto(s).` + (noElim ? ` ${noElim} no se pudieron borrar del bucket${errMsg?': '+errMsg:''}.` : '')
    + (fallos ? ` ${fallos} registro(s) no se pudieron actualizar (revisa permisos de UPDATE).` : '');
  fetchEntries();
  await loadInventory();
  setPfStatus(msg, !!(noElim || fallos));
}

// ---- Formulario (nueva / editar) ----
function openForm(existing){
  editingId = existing ? existing.id : null;
  document.getElementById('formTitle').textContent = existing ? 'Editar intervención' : 'Nueva intervención';
  const now=new Date(); now.setMinutes(now.getMinutes()-now.getTimezoneOffset());
  document.getElementById('fecha').value = existing ? new Date(existing.fecha).toISOString().slice(0,16) : now.toISOString().slice(0,16);
  const tsel=document.getElementById('turno');
  tsel.querySelectorAll('option[data-legacy]').forEach(o=>o.remove());
  if(existing?.turno && ![...tsel.options].some(o=>o.value===existing.turno)){ const o=new Option(existing.turno,existing.turno); o.dataset.legacy='1'; tsel.add(o); }
  tsel.value = existing?.turno || '';
  document.getElementById('maquina').value = existing?.maquina || '';
  document.getElementById('falla').value = existing?.falla || '';
  document.getElementById('descripcion').value = existing?.descripcion || '';
  document.getElementById('acCalibrado').checked = !!existing?.calibrado;
  document.getElementById('acCambiado').checked = !!existing?.cambiado;
  document.getElementById('acRevisado').checked = !!existing?.revisado;
  document.getElementById('acOtra').checked = !!existing?.otra_accion;
  document.getElementById('otraAccion').value = existing?.otra_accion || '';
  document.getElementById('otraAccion').classList.toggle('hidden', !existing?.otra_accion);
  if(!maquinasSheet.length) loadMaquinas();
  document.getElementById('repuestos').value = existing?.repuestos || '';
  document.getElementById('fotos').value='';
  document.getElementById('thumbsPreview').innerHTML='';
  setStatus('');
  document.getElementById('detailOverlay').classList.remove('open');
  document.getElementById('formOverlay').classList.add('open');
}
document.getElementById('acOtra').addEventListener('change',(ev)=>{
  const t=document.getElementById('otraAccion'); t.classList.toggle('hidden', !ev.target.checked);
  if(ev.target.checked) t.focus(); else t.value='';
});
document.getElementById('btnNew').addEventListener('click',()=>openForm(null));
document.getElementById('closeForm').addEventListener('click',()=>document.getElementById('formOverlay').classList.remove('open'));

document.getElementById('fotos').addEventListener('change',(ev)=>{
  const wrap=document.getElementById('thumbsPreview'); wrap.innerHTML='';
  [...ev.target.files].forEach(f=>{ const img=document.createElement('img'); img.src=URL.createObjectURL(f); wrap.appendChild(img); });
});

function setStatus(msg,isErr){
  const s=document.getElementById('formStatus'); s.textContent=msg||''; s.className='status'+(isErr?' err':'');
}

document.getElementById('btnGuardar').addEventListener('click', async ()=>{
  const maquina=document.getElementById('maquina').value.trim();
  const falla=document.getElementById('falla').value.trim();
  if(!maquina || !falla){ setStatus('Indica al menos la máquina y la falla detectada.',true); return; }
  const original = editingId ? entries.find(x=>x.id===editingId)?.maquina : null;
  if(maquinasSheet.length && maquina !== original){
    const ok = matchMaquina(maquina);
    if(!ok){ setStatus('Selecciona una máquina de la lista.',true); return; }
    document.getElementById('maquina').value = ok;
  }
  const otraOn = document.getElementById('acOtra').checked;
  const otraTxt = document.getElementById('otraAccion').value.trim();
  if(otraOn && !otraTxt){ setStatus('Describe la otra acción realizada.',true); return; }
  const maquinaFinal = document.getElementById('maquina').value.trim();
  const btn=document.getElementById('btnGuardar'); btn.disabled=true; setStatus('Guardando...');
  try{
    let photoPaths = editingId ? (entries.find(x=>x.id===editingId)?.fotos || []) : [];
    const files=[...document.getElementById('fotos').files];
    for(let i=0;i<files.length;i++){
      let blob = files[i];
      let ext = 'jpg';
      try{
        setStatus(`Comprimiendo foto ${i+1}/${files.length}...`);
        blob = await compressImage(files[i]);
      }catch(e){
        console.error('Compresión falló, se sube el original:', e);
        ext = (files[i].name.split('.').pop()||'jpg').toLowerCase();
      }
      if(blob.size > 10*1024*1024){
        setStatus(`La foto ${i+1} pesa más de 10 MB; se omite.`,true);
        continue;
      }
      const path = `${currentUser.id}/${Date.now()}_${i}.${ext}`;
      setStatus(`Subiendo foto ${i+1}/${files.length}...`);
      const { error: upErr } = await supabase.storage.from(FOTOS_BUCKET).upload(path, blob, {
        contentType: blob.type || 'image/jpeg', upsert:false
      });
      if(upErr){
        console.error('Fallo al subir foto:', upErr);
        setStatus(`No se pudo subir la foto ${i+1}: ${upErr.message}. Se omite.`,true);
        continue;
      }
      photoPaths.push(path);
    }
    const data = {
      fecha:new Date(document.getElementById('fecha').value).toISOString(),
      turno:document.getElementById('turno').value,
      maquina: maquinaFinal, falla,
      descripcion:document.getElementById('descripcion').value.trim(),
      calibrado:document.getElementById('acCalibrado').checked,
      cambiado:document.getElementById('acCambiado').checked,
      revisado:document.getElementById('acRevisado').checked,
      otra_accion: otraOn ? otraTxt : '',
      repuestos:document.getElementById('repuestos').value.trim(),
      fotos:photoPaths,
      tecnico: soloUsuario(currentUser.email),
      autor_uid: currentUser.id,
    };
    let error;
    if(editingId){
      ({ error } = await supabase.from('intervenciones').update(data).eq('id', editingId));
    } else {
      ({ error } = await supabase.from('intervenciones').insert(data));
    }
    if(error){
      setStatus(editingId ? 'No tienes permisos de administrador para editar, o hubo un error.' : ('Error al guardar: '+error.message), true);
      return;
    }
    document.getElementById('formOverlay').classList.remove('open');
  }catch(e){
    setStatus('Error inesperado: '+(e?.message||e), true);
  }finally{
    btn.disabled=false;
  }
});

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
